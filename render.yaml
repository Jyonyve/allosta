services:
  - type: web
    name: allosta-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    autoDeploy: true
    healthCheckPath: /
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir apps/api exec prisma generate && pnpm --dir apps/api build
    startCommand: pnpm --dir apps/api exec prisma migrate deploy && if [ "${SEED_DEMO:-false}" = "true" ]; then pnpm --dir apps/api seed; fi && pnpm --dir apps/api start:prod
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: 10000
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false