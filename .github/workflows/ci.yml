name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alostar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alostar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/alostar_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/alostar_test?schema=public
      JWT_SECRET: ci-test-only-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.18.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir apps/api exec prisma generate --config prisma.test.config.ts

      - name: Apply database migrations
        run: pnpm db:test:migrate

      - name: Run API unit tests
        run: pnpm --dir apps/api test --runInBand

      - name: Run PostgreSQL integration tests
        run: pnpm --dir apps/api test:integration

      - name: Build API
        run: pnpm --dir apps/api build

      - name: Build web
        run: pnpm --dir apps/web build
